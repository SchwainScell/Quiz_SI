// STATE MANAGEMENT & ENGINE LOGIC
let currentMode = 'practice'; // 'practice' or 'exam'
let currentSection = 'all';
let activeQuestions = [];
let currentIndex = 0;
let userAnswers = {};
let examTimer = null;
let timeRemaining = 3600; // 60 mins in seconds

function setMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
    if (mode === 'practice') {
        document.querySelectorAll('.mode-btn')[0].classList.add('active');
        document.getElementById('sectionFilterGroup').style.display = 'block';
        document.getElementById('timerContainer').style.display = 'none';
    } else {
        document.querySelectorAll('.mode-btn')[1].classList.add('active');
        document.getElementById('sectionFilterGroup').style.display = 'none';
        document.getElementById('timerContainer').style.display = 'block';
    }
}

function filterSection() {
    currentSection = document.getElementById('sectionSelect').value;
}

function startQuiz() {
    document.getElementById('controlsPanel').style.display = 'none';
    document.getElementById('modeSelect').style.display = 'none';
    document.getElementById('resultsPanel').style.display = 'none';
    document.getElementById('quizCard').classList.add('active');

    userAnswers = {};
    currentIndex = 0;

    if (currentMode === 'practice') {
        if (currentSection === 'all') {
            activeQuestions = [...questionsData];
        } else {
            activeQuestions = questionsData.filter(q => q.section === currentSection);
        }
    } else {
        // EXAM MODE: Sample 50 questions evenly or shuffle
        let shuffled = [...questionsData].sort(() => 0.5 - Math.random());
        activeQuestions = shuffled.slice(0, Math.min(50, shuffled.length));
        startTimer();
    }

    renderQuestion();
}

function renderQuestion() {
    if (activeQuestions.length === 0) {
        alert("No questions available for the selected criteria.");
        resetApp();
        return;
    }

    const q = activeQuestions[currentIndex];
    document.getElementById('sectionBadge').innerText = q.section;
    document.getElementById('questionTracker').innerText = `Question ${currentIndex + 1} / ${activeQuestions.length}`;
    document.getElementById('questionText').innerText = q.question;

    const imgContainer = document.getElementById('imageContainer');
    imgContainer.innerHTML = '';
    if (q.image) {
        const img = document.createElement('img');
        img.src = q.image;
        img.className = 'question-img';
        imgContainer.appendChild(img);
    }

    const optionsList = document.getElementById('optionsList');
    optionsList.innerHTML = '';

    q.options.forEach((optText, optIdx) => {
        const optDiv = document.createElement('div');
        optDiv.className = 'option-item';
        optDiv.innerText = `${String.fromCharCode(65 + optIdx)}. ${optText}`;

        if (userAnswers[currentIndex] !== undefined) {
            if (currentMode === 'practice') {
                if (optIdx === q.answer) optDiv.classList.add('correct');
                if (userAnswers[currentIndex] === optIdx && optIdx !== q.answer) optDiv.classList.add('wrong');
            } else {
                if (userAnswers[currentIndex] === optIdx) optDiv.classList.add('active');
            }
        }

        optDiv.onclick = () => selectOption(optIdx);
        optionsList.appendChild(optDiv);
    });

    const expBox = document.getElementById('explanationBox');
    if (currentMode === 'practice' && userAnswers[currentIndex] !== undefined) {
        expBox.style.display = 'block';
        expBox.innerHTML = `<strong>Explanation:</strong> ${q.explanation}`;
    } else {
        expBox.style.display = 'none';
    }

    document.getElementById('prevBtn').style.visibility = currentIndex === 0 ? 'hidden' : 'visible';
    document.getElementById('nextBtn').innerText = currentIndex === activeQuestions.length - 1 ? (currentMode === 'exam' ? 'Submit Exam' : 'Finish Practice') : 'Next';
}

function selectOption(optIdx) {
    if (currentMode === 'practice' && userAnswers[currentIndex] !== undefined) return; // Prevent change in practice after selection
    userAnswers[currentIndex] = optIdx;
    renderQuestion();
}

function navigate(direction) {
    if (direction === 1 && currentIndex === activeQuestions.length - 1) {
        finishQuiz();
        return;
    }
    currentIndex += direction;
    renderQuestion();
}

function startTimer() {
    timeRemaining = 3600;
    updateTimerDisplay();
    examTimer = setInterval(() => {
        timeRemaining--;
        updateTimerDisplay();
        if (timeRemaining <= 0) {
            clearInterval(examTimer);
            alert("Time limit reached! Submitting your exam.");
            finishQuiz();
        }
    }, 1000);
}

function updateTimerDisplay() {
    const mins = Math.floor(timeRemaining / 60);
    const secs = timeRemaining % 60;
    document.getElementById('timerDisplay').innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
}

function finishQuiz() {
    if (examTimer) clearInterval(examTimer);

    document.getElementById('quizCard').classList.remove('active');
    document.getElementById('resultsPanel').style.display = 'block';

    let score = 0;
    activeQuestions.forEach((q, idx) => {
        if (userAnswers[idx] === q.answer) score++;
    });

    const percentage = Math.round((score / activeQuestions.length) * 100);
    document.getElementById('scoreDisplay').innerText = `${percentage}%`;
    document.getElementById('scoreSummary').innerText = `You scored ${score} out of ${activeQuestions.length} questions correctly.`;
}

function resetApp() {
    if (examTimer) clearInterval(examTimer);
    document.getElementById('controlsPanel').style.display = 'flex';
    document.getElementById('modeSelect').style.display = 'grid';
    document.getElementById('quizCard').classList.remove('active');
    document.getElementById('resultsPanel').style.display = 'none';
}
</script>
